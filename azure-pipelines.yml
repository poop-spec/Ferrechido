trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: 22.x
    displayName: Use Node.js 22

  - script: npm ci
    displayName: Install Expo app dependencies

  - script: npm run typecheck
    displayName: Type-check Expo app

  - script: npm ci
    workingDirectory: api
    displayName: Install Functions API dependencies

  - script: npm run build
    workingDirectory: api
    displayName: Build Functions API
